name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs write access to the repository.
permissions:
  contents: read

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the engines floor declared in package.json; upper
        # bound is current. Both are exercised because better-sqlite3 is a
        # native module and its prebuilds are version specific.
        #
        # Node 20 is deliberately not supported. Nuxt 4 itself runs on 20.19+,
        # but ESLint 10 reaches Object.groupBy through eslint-flat-config-utils
        # and that intrinsic does not exist before Node 21, so lint cannot run
        # there at all. Claiming 20 support would mean an untestable floor.
        node-version: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # setup-node honours the packageManager field for pnpm and yarn but not
      # for npm, so it is applied explicitly here. This is not cosmetic: npm 11
      # records platform-specific optional binaries (@rolldown/binding-*,
      # @oxc-parser/binding-*) differently from npm 10, and npm 10 reading an
      # npm 11 lockfile rejects it as out of sync. Reading the version from
      # package.json rather than hardcoding it keeps the two from drifting.
      - name: Use the npm version declared in packageManager
        run: |
          npm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${npm_version}"
          npm --version

      # `npm ci` installs strictly from the lockfile and fails if the lockfile
      # and package.json have drifted. Its postinstall runs `nuxt prepare`,
      # which generates the .nuxt types that lint and typecheck both need.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
